name: Run Dog Script

on:
  workflow_dispatch:

jobs:
  run-dog:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies directly
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp
    
    - name: Run dog.py
      run: |
        echo "Starting dog.py at $(date)"
        python dog.py
        echo "dog.py finished at $(date)"
